<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERMS – Enterprise Request Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .badge-Pending { background: #FEF3C7; color: #B45309; border: 1px solid #FCD34D; }
    .badge-Approved { background: #E0F2FE; color: #0369A1; border: 1px solid #BAE6FD; }
    .badge-Rejected { background: #FFE4E6; color: #BE123C; border: 1px solid #FECDD3; }
    .badge-Assigned { background: #EEF2FF; color: #4338CA; border: 1px solid #C7D2FE; }
    .badge-InProgress { background: #F3E8FF; color: #6D28D9; border: 1px solid #DDD6FE; }
    .badge-Completed { background: #D1FAE5; color: #047857; border: 1px solid #A7F3D0; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- TOP NAVBAR -->
  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-40 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="showView('landing')">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center font-black text-xl shadow-md">
          E
        </div>
        <div>
          <span class="text-xl font-bold tracking-tight">ERMS</span>
          <span class="text-xs block text-slate-400">Enterprise Request Management System</span>
        </div>
      </div>
      <div id="nav-actions" class="flex items-center space-x-3"></div>
    </div>
  </header>

  <!-- MAIN VIEW CONTAINER -->
  <main id="app-root" class="flex-1 max-w-7xl mx-auto w-full p-4 sm:p-6"></main>

  <!-- ASSIGN TECHNICIAN MODAL (FOR MANAGERS) -->
  <div id="assign-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200">
      <div class="flex justify-between items-center pb-3 border-b border-slate-100">
        <div>
          <h3 class="text-lg font-bold text-slate-900">Assign Technician</h3>
          <p id="assign-modal-req-title" class="text-xs text-slate-500 mt-0.5"></p>
        </div>
        <button onclick="closeAssignModal()" class="text-slate-400 hover:text-slate-700 text-2xl font-bold leading-none">&times;</button>
      </div>

      <div class="py-4">
        <label class="block text-xs font-semibold text-slate-700 mb-2">Select Qualified Technician:</label>
        <div id="technician-list-container" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>

        <!-- Option to Add New Technician -->
        <div class="mt-4 pt-3 border-t border-slate-100">
          <button onclick="toggleNewTechForm()" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 flex items-center space-x-1">
            <span>+ Add New Technician to System</span>
          </button>
          <div id="new-tech-form" class="hidden mt-2 p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
            <input type="text" id="new-tech-name" placeholder="Full Name" class="w-full text-xs p-2 border rounded-lg">
            <input type="email" id="new-tech-email" placeholder="Email Address" class="w-full text-xs p-2 border rounded-lg">
            <input type="text" id="new-tech-dept" placeholder="Department (e.g. IT Hardware)" class="w-full text-xs p-2 border rounded-lg">
            <button onclick="saveNewTechnician()" class="w-full py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold">Save & Add Technician</button>
          </div>
        </div>
      </div>

      <div class="flex justify-end space-x-2 pt-3 border-t border-slate-100">
        <button onclick="closeAssignModal()" class="px-4 py-2 border border-slate-300 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100">Cancel</button>
        <button onclick="confirmAssignment()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold shadow-sm">Confirm Assignment</button>
      </div>
    </div>
  </div>

  <!-- NOTIFICATIONS MODAL -->
  <div id="notif-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-50 flex justify-end">
    <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col p-5">
      <div class="flex justify-between items-center pb-4 border-b border-slate-200">
        <h3 class="font-bold text-lg text-slate-800">Notifications</h3>
        <button onclick="toggleNotifs()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>
      <div id="notif-items" class="flex-1 overflow-y-auto py-4 space-y-3"></div>
      <button onclick="clearNotifs()" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-xs font-semibold rounded-lg text-slate-700">Clear All Notifications</button>
    </div>
  </div>

  <script>
    // --- DATABASE & PERSISTENCE ---
    const DB_KEY = 'erms_system_data_v2';

    function initDB() {
      if (!localStorage.getItem(DB_KEY)) {
        const initialData = {
          currentUser: null,
          users: [
            { id: 1, name: 'Sarah Jenkins', email: 'sarah@enterprise.com', password: 'password123', role: 'requester', department: 'Product Marketing' },
            { id: 2, name: 'David Miller', email: 'david@enterprise.com', password: 'password123', role: 'manager', department: 'Operations' },
            { id: 3, name: 'Alex Rivera', email: 'alex@enterprise.com', password: 'password123', role: 'technician', department: 'IT Hardware Support', status: 'Available' },
            { id: 4, name: 'Maria Santos', email: 'maria@enterprise.com', password: 'password123', role: 'technician', department: 'Network & Cloud Infrastructure', status: 'Available' }
          ],
          requests: [
            { id: 101, title: 'MacBook Pro Screen Glitch', category: 'Hardware', priority: 'High', status: 'Assigned', requesterId: 1, requesterName: 'Sarah Jenkins', requesterDept: 'Product Marketing', techId: 3, techName: 'Alex Rivera', description: 'Screen flashes purple artifacts during Zoom video meetings.', date: '2026-09-28' },
            { id: 102, title: 'VPN Certificate Renewal', category: 'Network', priority: 'Critical', status: 'Pending', requesterId: 1, requesterName: 'Sarah Jenkins', requesterDept: 'Product Marketing', techId: null, techName: null, description: 'Cannot reach production analytics cluster while working remotely.', date: '2026-09-29' }
          ],
          notifications: [
            { id: 1, text: 'Welcome to Enterprise Request Management System.', date: 'Just now' }
          ]
        };
        localStorage.setItem(DB_KEY, JSON.stringify(initialData));
      }
    }
    initDB();

    function getDB() { return JSON.parse(localStorage.getItem(DB_KEY)); }
    function saveDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }

    // --- NAVIGATION CONTROLLER ---
    function showView(view, param = null) {
      const db = getDB();
      const root = document.getElementById('app-root');
      const nav = document.getElementById('nav-actions');

      if (db.currentUser) {
        const u = db.currentUser;
        nav.innerHTML = `
          <button onclick="toggleNotifs()" class="relative p-2 text-slate-300 hover:text-white" title="Notifications">
            <span class="text-xl">🔔</span>
            <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full"></span>
          </button>
          <div class="hidden sm:flex flex-col text-right">
            <span class="text-xs font-bold text-white leading-tight">${u.name}</span>
            <span class="text-[10px] text-sky-400 capitalize font-medium">${u.role} &bull; ${u.department || 'Enterprise'}</span>
          </div>
          <button onclick="logout()" class="text-xs bg-red-600/90 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg font-semibold transition">Logout</button>
        `;
      } else {
        nav.innerHTML = `
          <button onclick="showView('landing')" class="text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg transition">All Portals</button>
        `;
      }

      if (view === 'landing') renderLanding(root, db);
      else if (view === 'auth') renderAuth(root, db, param || { role: 'requester', mode: 'login' });
      else if (view === 'requester_dashboard') renderRequesterDashboard(root, db);
      else if (view === 'manager_dashboard') renderManagerDashboard(root, db);
      else if (view === 'technician_dashboard') renderTechnicianDashboard(root, db);
    }

    // --- LANDING PAGE ---
    function renderLanding(root, db) {
      if (db.currentUser) {
        showView(db.currentUser.role + '_dashboard');
        return;
      }
      root.innerHTML = `
        <div class="text-center py-10 sm:py-16">
          <span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Enterprise System</span>
          <h1 class="text-3xl sm:text-5xl font-extrabold text-slate-900 mt-4 tracking-tight">Enterprise Request Management</h1>
          <p class="text-slate-600 max-w-2xl mx-auto mt-3 text-sm sm:text-base">Role-governed operations platform with full ticket lifecycles, custom accounts, and manual technician dispatch.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-5xl mx-auto">
          <!-- Requester Card -->
          <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between">
            <div>
              <div class="w-12 h-12 bg-sky-100 text-sky-600 rounded-xl flex items-center justify-center text-2xl font-bold mb-4">👤</div>
              <h3 class="text-xl font-bold text-slate-800">Requester Portal</h3>
              <p class="text-slate-500 text-xs sm:text-sm mt-2">Log in with your own credentials or create a new account to file tickets and track resolution.</p>
            </div>
            <div class="mt-6 space-y-2">
              <button onclick="showView('auth', { role: 'requester', mode: 'login' })" class="w-full py-2.5 bg-sky-600 hover:bg-sky-700 text-white rounded-xl font-semibold text-xs sm:text-sm transition">Sign In as Requester</button>
              <button onclick="showView('auth', { role: 'requester', mode: 'signup' })" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-semibold text-xs transition">Create Requester Account</button>
            </div>
          </div>

          <!-- Manager Card -->
          <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between">
            <div>
              <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center text-2xl font-bold mb-4">📊</div>
              <h3 class="text-xl font-bold text-slate-800">Manager Portal</h3>
              <p class="text-slate-500 text-xs sm:text-sm mt-2">Review requests, approve/reject, change priorities, and assign skilled technicians directly.</p>
            </div>
            <div class="mt-6 space-y-2">
              <button onclick="showView('auth', { role: 'manager', mode: 'login' })" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold text-xs sm:text-sm transition">Sign In as Manager</button>
              <button onclick="showView('auth', { role: 'manager', mode: 'signup' })" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-semibold text-xs transition">Create Manager Account</button>
            </div>
          </div>

          <!-- Technician Card -->
          <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between">
            <div>
              <div class="w-12 h-12 bg-teal-100 text-teal-600 rounded-xl flex items-center justify-center text-2xl font-bold mb-4">🛠️</div>
              <h3 class="text-xl font-bold text-slate-800">Technician Terminal</h3>
              <p class="text-slate-500 text-xs sm:text-sm mt-2">View assigned tickets, update progress, add technician work notes, and resolve issues.</p>
            </div>
            <div class="mt-6 space-y-2">
              <button onclick="showView('auth', { role: 'technician', mode: 'login' })" class="w-full py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-xl font-semibold text-xs sm:text-sm transition">Sign In as Technician</button>
              <button onclick="showView('auth', { role: 'technician', mode: 'signup' })" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-semibold text-xs transition">Create Technician Account</button>
            </div>
          </div>
        </div>
      `;
    }

    // --- AUTH (SIGN IN & REGISTER WITH YOUR OWN DETAILS) ---
    function renderAuth(root, db, config) {
      const role = config.role;
      const isSignUp = config.mode === 'signup';
      const roleTheme = {
        requester: { color: 'sky', label: 'Requester' },
        manager: { color: 'indigo', label: 'Manager' },
        technician: { color: 'teal', label: 'Technician' }
      }[role];

      root.innerHTML = `
        <div class="max-w-md mx-auto my-8 bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200">
          <div class="text-center mb-6">
            <span class="text-xs uppercase font-bold tracking-wider text-${roleTheme.color}-600 bg-${roleTheme.color}-50 px-3 py-1 rounded-full">${roleTheme.label} Portal</span>
            <h2 class="text-2xl font-bold text-slate-900 mt-2">${isSignUp ? 'Create New Account' : 'Sign In with Your Details'}</h2>
            <p class="text-xs text-slate-500 mt-1">${isSignUp ? 'Enter your custom details to register' : 'Enter your email and password'}</p>
          </div>

          <form onsubmit="handleAuthSubmit(event, '${role}', ${isSignUp})" class="space-y-4">
            ${isSignUp ? `
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Your Full Name</label>
                <input type="text" id="auth-name" required placeholder="e.g. Alex Johnson" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-${roleTheme.color}-500">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Department / Specialty</label>
                <input type="text" id="auth-dept" required placeholder="e.g. Finance, IT, Logistics" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-${roleTheme.color}-500">
              </div>
            ` : ''}

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
              <input type="email" id="auth-email" required placeholder="youremail@example.com" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-${roleTheme.color}-500">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
              <input type="password" id="auth-pass" required placeholder="Enter password" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-${roleTheme.color}-500">
            </div>

            <button type="submit" class="w-full py-2.5 bg-${roleTheme.color}-600 hover:bg-${roleTheme.color}-700 text-white font-semibold rounded-xl text-sm transition shadow-sm">
              ${isSignUp ? 'Complete Registration & Sign In' : 'Sign In to ' + roleTheme.label + ' Portal'}
            </button>
          </form>

          <div class="mt-6 pt-4 border-t border-slate-100 text-center">
            ${isSignUp ? `
              <p class="text-xs text-slate-600">Already registered? 
                <button onclick="showView('auth', { role: '${role}', mode: 'login' })" class="text-${roleTheme.color}-600 font-bold hover:underline">Sign In here</button>
              </p>
            ` : `
              <p class="text-xs text-slate-600">Want to register with your own details? 
                <button onclick="showView('auth', { role: '${role}', mode: 'signup' })" class="text-${roleTheme.color}-600 font-bold hover:underline">Create an account</button>
              </p>
            `}
            <div class="mt-3">
              <button onclick="showView('landing')" class="text-xs text-slate-400 hover:text-slate-600">&larr; Back to all portals</button>
            </div>
          </div>
        </div>
      `;
    }

    function handleAuthSubmit(e, role, isSignUp) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value.trim().toLowerCase();
      const password = document.getElementById('auth-pass').value.trim();
      const db = getDB();

      if (isSignUp) {
        const name = document.getElementById('auth-name').value.trim();
        const dept = document.getElementById('auth-dept').value.trim();

        if (db.users.some(u => u.email === email)) {
          alert('An account with this email already exists. Please sign in instead.');
          return;
        }

        const newUser = {
          id: Date.now(),
          name: name,
          email: email,
          password: password,
          role: role,
          department: dept,
          status: role === 'technician' ? 'Available' : undefined
        };

        db.users.push(newUser);
        db.currentUser = newUser;
        db.notifications.unshift({ id: Date.now(), text: `New ${role} account registered: ${name}`, date: 'Just now' });
        saveDB(db);
        alert(`Account created successfully! Welcome, ${name}.`);
        showView(role + '_dashboard');
      } else {
        const found = db.users.find(u => u.email.toLowerCase() === email && u.password === password);
        if (!found) {
          alert('Invalid email or password. If you do not have an account, click "Create an account" below.');
          return;
        }
        if (found.role !== role) {
          alert(`Access Restricted: This account is registered as "${found.role}". Please log in via the ${found.role} portal.`);
          return;
        }
        db.currentUser = found;
        saveDB(db);
        showView(role + '_dashboard');
      }
    }

    function logout() {
      const db = getDB();
      db.currentUser = null;
      saveDB(db);
      showView('landing');
    }

    // --- REQUESTER DASHBOARD ---
    function renderRequesterDashboard(root, db) {
      const user = db.currentUser;
      const myReqs = db.requests.filter(r => r.requesterId === user.id);

      root.innerHTML = `
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
          <div>
            <h2 class="text-2xl font-bold text-slate-900">Requester Dashboard</h2>
            <p class="text-xs text-slate-500">Welcome, <strong class="text-slate-700">${user.name}</strong> &bull; Department: ${user.department || 'General'}</p>
          </div>
          <button onclick="openNewReqModal()" class="px-4 py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-semibold text-xs sm:text-sm rounded-xl shadow-sm transition">+ Submit New Request</button>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
          <div class="p-4 border-b border-slate-100 flex justify-between items-center">
            <span class="font-bold text-slate-800">Your Submitted Requests (${myReqs.length})</span>
            <span class="text-xs text-slate-400">Track real-time progress and assignments</span>
          </div>

          ${myReqs.length === 0 ? `
            <div class="p-8 text-center text-slate-400 text-sm">
              You haven't submitted any requests yet. Click <strong>+ Submit New Request</strong> to create one!
            </div>
          ` : `
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm">
                <thead class="bg-slate-50 text-slate-600 text-xs uppercase font-semibold">
                  <tr>
                    <th class="p-3">Ticket ID</th>
                    <th class="p-3">Title</th>
                    <th class="p-3">Category</th>
                    <th class="p-3">Priority</th>
                    <th class="p-3">Status</th>
                    <th class="p-3">Assigned Technician</th>
                    <th class="p-3">Date</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${myReqs.map(r => `
                    <tr class="hover:bg-slate-50/80">
                      <td class="p-3 font-mono text-xs font-semibold text-slate-500">#${r.id}</td>
                      <td class="p-3">
                        <div class="font-semibold text-slate-800">${r.title}</div>
                        <div class="text-xs text-slate-500 truncate max-w-xs">${r.description}</div>
                      </td>
                      <td class="p-3 text-slate-600 text-xs">${r.category}</td>
                      <td class="p-3">
                        <span class="text-xs px-2 py-0.5 rounded font-semibold ${r.priority === 'Critical' ? 'bg-red-100 text-red-700' : r.priority === 'High' ? 'bg-orange-100 text-orange-700' : 'bg-slate-100 text-slate-700'}">${r.priority}</span>
                      </td>
                      <td class="p-3"><span class="badge-${r.status} text-xs font-semibold px-2.5 py-0.5 rounded-full">${r.status}</span></td>
                      <td class="p-3 text-xs">
                        ${r.techName ? `<span class="font-semibold text-teal-700">🛠️ ${r.techName}</span>` : '<span class="text-slate-400 italic">Waiting for assignment</span>'}
                      </td>
                      <td class="p-3 text-xs text-slate-400">${r.date}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `}
        </div>

        <div id="new-req-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl border border-slate-200">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100">
              <h3 class="text-lg font-bold text-slate-900">Submit New Service Request</h3>
              <button onclick="closeNewReqModal()" class="text-slate-400 hover:text-slate-700 text-2xl font-bold leading-none">&times;</button>
            </div>
            <form onsubmit="submitNewRequest(event)" class="space-y-4 pt-3">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Issue / Request Title</label>
                <input type="text" id="req-title" required placeholder="Brief summary of what is needed" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-sky-500">
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Category</label>
                  <select id="req-cat" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                    <option>Hardware</option>
                    <option>Network & Wi-Fi</option>
                    <option>Software & Access</option>
                    <option>Facilities & Equipment</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Priority</label>
                  <select id="req-prio" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
                    <option>Low</option>
                    <option selected>Medium</option>
                    <option>High</option>
                    <option>Critical</option>
                  </select>
                </div>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Detailed Description</label>
                <textarea id="req-desc" rows="3" required placeholder="Describe the problem, error messages, and room/desk location..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-sky-500"></textarea>
              </div>
              <div class="flex justify-end space-x-2 pt-2 border-t border-slate-100">
                <button type="button" onclick="closeNewReqModal()" class="px-4 py-2 border rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-50">Cancel</button>
                <button type="submit" class="px-5 py-2 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-semibold shadow-sm">Submit Request</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function openNewReqModal() { document.getElementById('new-req-modal').classList.remove('hidden'); }
    function closeNewReqModal() { document.getElementById('new-req-modal').classList.add('hidden'); }

    function submitNewRequest(e) {
      e.preventDefault();
      const db = getDB();
      const newReq = {
        id: Math.floor(100 + Math.random() * 900),
        title: document.getElementById('req-title').value.trim(),
        category: document.getElementById('req-cat').value,
        priority: document.getElementById('req-prio').value,
        status: 'Pending',
        requesterId: db.currentUser.id,
        requesterName: db.currentUser.name,
        requesterDept: db.currentUser.department || 'General',
        techId: null,
        techName: null,
        description: document.getElementById('req-desc').value.trim(),
        date: new Date().toISOString().split('T')[0]
      };

      db.requests.unshift(newReq);
      db.notifications.unshift({ id: Date.now(), text: `New Ticket #${newReq.id} ("${newReq.title}") submitted by ${db.currentUser.name}.`, date: 'Just now' });
      saveDB(db);
      closeNewReqModal();
      showView('requester_dashboard');
    }

    // --- MANAGER COMMAND CENTER ---
    let currentAssignReqId = null;

    function renderManagerDashboard(root, db) {
      const user = db.currentUser;
      const technicians = db.users.filter(u => u.role === 'technician');

      root.innerHTML = `
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
          <div>
            <h2 class="text-2xl font-bold text-slate-900">Manager Command Center</h2>
            <p class="text-xs text-slate-500">Logged in: <strong class="text-slate-700">${user.name}</strong> &bull; Total Technicians on Roster: <strong class="text-indigo-600">${technicians.length}</strong></p>
          </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
          <div class="bg-white p-4 rounded-xl border border-slate-200">
            <span class="text-xs font-semibold text-slate-400">Total Inquiries</span>
            <div class="text-2xl font-bold text-slate-800">${db.requests.length}</div>
          </div>
          <div class="bg-white p-4 rounded-xl border border-slate-200">
            <span class="text-xs font-semibold text-amber-500">Pending Review</span>
            <div class="text-2xl font-bold text-amber-600">${db.requests.filter(r => r.status === 'Pending').length}</div>
          </div>
          <div class="bg-white p-4 rounded-xl border border-slate-200">
            <span class="text-xs font-semibold text-indigo-500">Active Work Orders</span>
            <div class="text-2xl font-bold text-indigo-600">${db.requests.filter(r => ['Assigned', 'InProgress'].includes(r.status)).length}</div>
          </div>
          <div class="bg-white p-4 rounded-xl border border-slate-200">
            <span class="text-xs font-semibold text-emerald-500">Completed</span>
            <div class="text-2xl font-bold text-emerald-600">${db.requests.filter(r => r.status === 'Completed').length}</div>
          </div>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
          <div class="p-4 border-b border-slate-100 flex justify-between items-center">
            <span class="font-bold text-slate-800">All Enterprise Requests</span>
            <span class="text-xs text-slate-400">Click <strong>"Assign Tech"</strong> to dispatch a technician</span>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead class="bg-slate-50 text-slate-600 text-xs uppercase font-semibold">
                <tr>
                  <th class="p-3">ID</th>
                  <th class="p-3">Requester</th>
                  <th class="p-3">Issue Title</th>
                  <th class="p-3">Priority</th>
                  <th class="p-3">Status</th>
                  <th class="p-3">Assigned Tech</th>
                  <th class="p-3 text-center">Tech Dispatch</th>
                  <th class="p-3 text-right">Approval Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${db.requests.map(r => `
                  <tr class="hover:bg-slate-50/80">
                    <td class="p-3 font-mono text-xs font-semibold text-slate-500">#${r.id}</td>
                    <td class="p-3 text-xs">
                      <div class="font-bold text-slate-800">${r.requesterName}</div>
                      <div class="text-[11px] text-slate-400">${r.requesterDept || 'Enterprise'}</div>
                    </td>
                    <td class="p-3">
                      <div class="font-semibold text-slate-800">${r.title}</div>
                      <div class="text-xs text-slate-500">${r.category}</div>
                    </td>
                    <td class="p-3">
                      <select onchange="changePriority(${r.id}, this.value)" class="text-xs border rounded px-1.5 py-0.5 bg-white font-medium">
                        <option ${r.priority === 'Low' ? 'selected' : ''}>Low</option>
                        <option ${r.priority === 'Medium' ? 'selected' : ''}>Medium</option>
                        <option ${r.priority === 'High' ? 'selected' : ''}>High</option>
                        <option ${r.priority === 'Critical' ? 'selected' : ''}>Critical</option>
                      </select>
                    </td>
                    <td class="p-3"><span class="badge-${r.status} text-xs font-semibold px-2.5 py-0.5 rounded-full">${r.status}</span></td>
                    <td class="p-3 text-xs">
                      ${r.techName ? `<span class="font-semibold text-teal-700">🛠️ ${r.techName}</span>` : '<span class="text-amber-600 font-semibold bg-amber-50 px-2 py-0.5 rounded">Unassigned</span>'}
                    </td>
                    
                    <td class="p-3 text-center">
                      <button onclick="openAssignModal(${r.id})" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold shadow-sm transition flex items-center justify-center space-x-1 mx-auto">
                        <span>🛠️</span>
                        <span>${r.techId ? 'Reassign Tech' : 'Assign Tech'}</span>
                      </button>
                    </td>

                    <td class="p-3 text-right space-x-1">
                      ${r.status === 'Pending' ? `
                        <button onclick="updateRequestStatus(${r.id}, 'Approved')" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold">Approve</button>
                        <button onclick="updateRequestStatus(${r.id}, 'Rejected')" class="px-2.5 py-1 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-semibold">Reject</button>
                      ` : `
                        <button onclick="updateRequestStatus(${r.id}, 'Pending')" class="text-xs text-slate-400 hover:text-slate-600 underline">Reset Status</button>
                      `}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function openAssignModal(reqId) {
      currentAssignReqId = reqId;
      const db = getDB();
      const r = db.requests.find(x => x.id === reqId);
      const technicians = db.users.filter(u => u.role === 'technician');

      document.getElementById('assign-modal-req-title').innerText = `Assigning for Ticket #${r.id}: "${r.title}"`;
      const container = document.getElementById('technician-list-container');

      if (technicians.length === 0) {
        container.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">No technicians found. Use the "+ Add New Technician" option below to register one.</div>`;
      } else {
        container.innerHTML = technicians.map(t => {
          const activeJobs = db.requests.filter(req => req.techId === t.id && req.status !== 'Completed').length;
          const isSelected = r.techId === t.id;
          return `
            <label class="flex items-center justify-between p-3 border rounded-xl hover:bg-slate-50 cursor-pointer ${isSelected ? 'border-indigo-500 bg-indigo-50/50' : 'border-slate-200'}">
              <div class="flex items-center space-x-3">
                <input type="radio" name="selected_tech" value="${t.id}" ${isSelected ? 'checked' : ''} class="w-4 h-4 text-indigo-600">
                <div>
                  <div class="font-bold text-xs text-slate-900">${t.name}</div>
                  <div class="text-[11px] text-slate-500">${t.department || 'General IT'}</div>
                </div>
              </div>
              <div class="text-right">
                <span class="text-[11px] px-2 py-0.5 rounded-full ${activeJobs === 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'} font-semibold">
                  ${activeJobs} active task${activeJobs === 1 ? '' : 's'}
                </span>
              </div>
            </label>
          `;
        }).join('');
      }

      document.getElementById('assign-modal').classList.remove('hidden');
    }

    function closeAssignModal() {
      document.getElementById('assign-modal').classList.add('hidden');
      currentAssignReqId = null;
    }

    function confirmAssignment() {
      const selected = document.querySelector('input[name="selected_tech"]:checked');
      if (!selected) {
        alert('Please select a technician from the list.');
        return;
      }
      const techId = parseInt(selected.value);
      const db = getDB();
      const r = db.requests.find(x => x.id === currentAssignReqId);
      const tech = db.users.find(u => u.id === techId);

      if (r && tech) {
        r.techId = tech.id;
        r.techName = tech.name;
        r.status = 'Assigned';
        db.notifications.unshift({ id: Date.now(), text: `Ticket #${r.id} successfully assigned to ${tech.name}.`, date: 'Just now' });
        saveDB(db);
        closeAssignModal();
        showView('manager_dashboard');
        alert(`Assigned to ${tech.name}!`);
      }
    }

    function toggleNewTechForm() {
      const form = document.getElementById('new-tech-form');
      form.classList.toggle('hidden');
    }

    function saveNewTechnician() {
      const name = document.getElementById('new-tech-name').value.trim();
      const email = document.getElementById('new-tech-email').value.trim().toLowerCase();
      const dept = document.getElementById('new-tech-dept').value.trim();

      if (!name || !email) {
        alert('Please provide technician name and email.');
        return;
      }
      const db = getDB();
      if (db.users.some(u => u.email === email)) {
        alert('A user with this email already exists.');
        return;
      }

      const newTech = {
        id: Date.now(),
        name: name,
        email: email,
        password: 'password123',
        role: 'technician',
        department: dept || 'Technical Services',
        status: 'Available'
      };

      db.users.push(newTech);
      saveDB(db);
      alert(`Technician ${name} added! You can now select them.`);
      toggleNewTechForm();
      openAssignModal(currentAssignReqId);
    }

    function updateRequestStatus(reqId, status) {
      const db = getDB();
      const r = db.requests.find(x => x.id === reqId);
      if (r) {
        r.status = status;
        db.notifications.unshift({ id: Date.now(), text: `Request #${reqId} marked as ${status} by Manager.`, date: 'Just now' });
        saveDB(db);
        showView('manager_dashboard');
      }
    }

    function changePriority(reqId, newPriority) {
      const db = getDB();
      const r = db.requests.find(x => x.id === reqId);
      if (r) {
        r.priority = newPriority;
        saveDB(db);
      }
    }

    // --- TECHNICIAN TERMINAL ---
    function renderTechnicianDashboard(root, db) {
      const user = db.currentUser;
      const myJobs = db.requests.filter(r => r.techId === user.id);

      root.innerHTML = `
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
          <div>
            <h2 class="text-2xl font-bold text-slate-900">Technician Workspace</h2>
            <p class="text-xs text-slate-500">Technician: <strong class="text-slate-700">${user.name}</strong> &bull; Department: ${user.department || 'Hardware & IT'}</p>
          </div>
          <span class="px-3 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-full">Status: ${user.status || 'Active'}</span>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
          <div class="p-4 border-b border-slate-100 flex justify-between items-center">
            <span class="font-bold text-slate-800">Your Assigned Work Orders (${myJobs.length})</span>
            <span class="text-xs text-slate-400">Update ticket state as you work</span>
          </div>

          ${myJobs.length === 0 ? `
            <div class="p-8 text-center text-slate-400 text-sm">
              No tasks currently assigned to you. When a Manager assigns you a request, it will appear right here!
            </div>
          ` : `
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm">
                <thead class="bg-slate-50 text-slate-600 text-xs uppercase font-semibold">
                  <tr>
                    <th class="p-3">Ticket ID</th>
                    <th class="p-3">Requester Info</th>
                    <th class="p-3">Title & Details</th>
                    <th class="p-3">Priority</th>
                    <th class="p-3">Status</th>
                    <th class="p-3 text-right">Work Action</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${myJobs.map(job => `
                    <tr class="hover:bg-slate-50/80">
                      <td class="p-3 font-mono text-xs font-semibold text-slate-500">#${job.id}</td>
                      <td class="p-3 text-xs">
                        <div class="font-bold text-slate-800">${job.requesterName}</div>
                        <div class="text-slate-400">${job.requesterDept || 'Enterprise'}</div>
                      </td>
                      <td class="p-3">
                        <div class="font-semibold text-slate-800">${job.title}</div>
                        <div class="text-xs text-slate-500">${job.description}</div>
                      </td>
                      <td class="p-3">
                        <span class="text-xs px-2 py-0.5 rounded font-semibold ${job.priority === 'Critical' ? 'bg-red-100 text-red-700' : 'bg-orange-100 text-orange-700'}">${job.priority}</span>
                      </td>
                      <td class="p-3"><span class="badge-${job.status} text-xs font-semibold px-2.5 py-0.5 rounded-full">${job.status}</span></td>
                      <td class="p-3 text-right">
                        ${job.status === 'Assigned' ? `
                          <button onclick="updateTechnicianTask(${job.id}, 'InProgress')" class="px-3 py-1.5 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-xs font-semibold shadow-sm">Start Working</button>
                        ` : job.status === 'InProgress' ? `
                          <button onclick="updateTechnicianTask(${job.id}, 'Completed')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold shadow-sm">Mark as Resolved ✓</button>
                        ` : `
                          <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded">✓ Resolved</span>
                        `}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `}
        </div>
      `;
    }

    function updateTechnicianTask(reqId, status) {
      const db = getDB();
      const r = db.requests.find(x => x.id === reqId);
      if (r) {
        r.status = status;
        db.notifications.unshift({ id: Date.now(), text: `Technician ${db.currentUser.name} updated Ticket #${reqId} to "${status}".`, date: 'Just now' });
        saveDB(db);
        showView('technician_dashboard');
      }
    }

    function toggleNotifs() {
      const modal = document.getElementById('notif-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        const db = getDB();
        const container = document.getElementById('notif-items');
        container.innerHTML = db.notifications.map(n => `
          <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs">
            <p class="text-slate-800 font-medium">${n.text}</p>
            <span class="text-[10px] text-slate-400 mt-1 block">${n.date}</span>
          </div>
        `).join('');
      }
    }

    function clearNotifs() {
      const db = getDB();
      db.notifications = [];
      saveDB(db);
      toggleNotifs();
    }

    showView('landing');
  </script>
</body>
</html>
