<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERMS – Enterprise Request Management System (Live Multi-Device Cloud)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- GUN.js: Peer-to-peer real-time cloud sync across any device without a custom backend server -->
  <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gun/sea.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .badge-Pending { background: #FEF3C7; color: #B45309; border: 1px solid #FCD34D; }
    .badge-Approved { background: #E0F2FE; color: #0369A1; border: 1px solid #BAE6FD; }
    .badge-Rejected { background: #FFE4E6; color: #BE123C; border: 1px solid #FECDD3; }
    .badge-Assigned { background: #EEF2FF; color: #4338CA; border: 1px solid #C7D2FE; }
    .badge-InProgress { background: #F3E8FF; color: #6D28D9; border: 1px solid #DDD6FE; }
    .badge-Completed { background: #D1FAE5; color: #047857; border: 1px solid #A7F3D0; }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .pulse-badge { animation: pulse-ring 2s infinite; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- TOP NAVBAR -->
  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-40 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="showView('landing')">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center font-black text-xl shadow-md">
          E
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <span class="text-xl font-bold tracking-tight">ERMS</span>
            <span id="cloud-sync-status" class="text-[10px] bg-emerald-500/20 text-emerald-300 font-mono px-2 py-0.5 rounded-full flex items-center space-x-1">
              <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-ping"></span>
              <span>Multi-Role Cloud Synced</span>
            </span>
          </div>
          <span class="text-xs block text-slate-400">Enterprise Real-Time Notification & Management System</span>
        </div>
      </div>
      <div id="nav-actions" class="flex items-center space-x-3"></div>
    </div>
  </header>

  <!-- LIVE POPUP TOAST ALERT CONTAINER -->
  <div id="toast-container" class="fixed top-20 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <!-- MAIN VIEW CONTAINER -->
  <main id="app-root" class="flex-1 max-w-7xl mx-auto w-full p-4 sm:p-6"></main>

  <!-- ASSIGN TECHNICIAN MODAL (FOR MANAGERS) -->
  <div id="assign-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200">
      <div class="flex justify-between items-center pb-3 border-b border-slate-100">
        <div>
          <h3 class="text-lg font-bold text-slate-900">Assign Technician</h3>
          <p id="assign-modal-req-title" class="text-xs text-slate-500 mt-0.5"></p>
        </div>
        <button onclick="closeAssignModal()" class="text-slate-400 hover:text-slate-700 text-2xl font-bold leading-none">&times;</button>
      </div>

      <div class="py-4">
        <label class="block text-xs font-semibold text-slate-700 mb-2">Select Qualified Technician:</label>
        <div id="technician-list-container" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>

        <!-- Option to Add New Technician -->
        <div class="mt-4 pt-3 border-t border-slate-100">
          <button onclick="toggleNewTechForm()" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 flex items-center space-x-1">
            <span>+ Add New Technician to System</span>
          </button>
          <div id="new-tech-form" class="hidden mt-2 p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
            <input type="text" id="new-tech-name" placeholder="Full Name" class="w-full text-xs p-2 border rounded-lg">
            <input type="email" id="new-tech-email" placeholder="Email Address" class="w-full text-xs p-2 border rounded-lg">
            <input type="text" id="new-tech-dept" placeholder="Department (e.g. IT Hardware)" class="w-full text-xs p-2 border rounded-lg">
            <button onclick="saveNewTechnician()" class="w-full py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold">Save & Add Technician</button>
          </div>
        </div>
      </div>

      <div class="flex justify-end space-x-2 pt-3 border-t border-slate-100">
        <button onclick="closeAssignModal()" class="px-4 py-2 border border-slate-300 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100">Cancel</button>
        <button onclick="confirmAssignment()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold shadow-sm">Confirm Assignment</button>
      </div>
    </div>
  </div>

  <!-- NOTIFICATIONS MODAL -->
  <div id="notif-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-50 flex justify-end">
    <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col p-5">
      <div class="flex justify-between items-center pb-4 border-b border-slate-200">
        <div>
          <h3 class="font-bold text-lg text-slate-800">Role Notifications Center</h3>
          <p id="notif-user-info" class="text-xs text-slate-500"></p>
        </div>
        <button onclick="toggleNotifs()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>
      <div id="notif-items" class="flex-1 overflow-y-auto py-4 space-y-3"></div>
      <button onclick="clearNotifs()" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-xs font-semibold rounded-lg text-slate-700">Clear All My Notifications</button>
    </div>
  </div>

  <script>
    // =========================================================================
    // REAL-TIME CLOUD SYNCHRONIZATION ACROSS MULTIPLE DEVICES VIA GUN.JS
    // =========================================================================
    const gun = Gun([
      'https://gun-manhattan.herokuapp.com/gun',
      'https://relay.peer.ooo/gun'
    ]);

    const SHARED_ORG_KEY = 'erms_enterprise_shared_v2';
    const gunDB = gun.get(SHARED_ORG_KEY);

    let memoryDB = {
      currentUser: null,
      users: [
        { id: 1, name: 'Sarah Jenkins', email: 'sarah@enterprise.com', password: 'password123', role: 'requester', department: 'Product Marketing' },
        { id: 2, name: 'David Miller', email: 'david@enterprise.com', password: 'password123', role: 'manager', department: 'Operations' },
        { id: 3, name: 'Alex Rivera', email: 'alex@enterprise.com', password: 'password123', role: 'technician', department: 'IT Hardware Support', status: 'Available' },
        { id: 4, name: 'Maria Santos', email: 'maria@enterprise.com', password: 'password123', role: 'technician', department: 'Network & Cloud Infrastructure', status: 'Available' }
      ],
      requests: [
        { 
          id: 101, 
          title: 'MacBook Pro Screen Glitch', 
          category: 'Hardware', 
          priority: 'High', 
          status: 'Assigned', 
          location: 'Building A - Main Headquarters, 3rd Floor (Marketing)', 
          requesterId: 1, 
          requesterName: 'Sarah Jenkins', 
          requesterDept: 'Product Marketing', 
          techId: 3, 
          techName: 'Alex Rivera', 
          description: 'Screen flashes purple artifacts during Zoom video meetings.', 
          date: '2026-09-28' 
        },
        { 
          id: 102, 
          title: 'VPN Certificate Renewal', 
          category: 'Network', 
          priority: 'Critical', 
          status: 'Pending', 
          location: 'Remote / Home Office', 
          requesterId: 1, 
          requesterName: 'Sarah Jenkins', 
          requesterDept: 'Product Marketing', 
          techId: null, 
          techName: null, 
          description: 'Cannot reach production analytics cluster while working remotely.', 
          date: '2026-09-29' 
        }
      ],
      notifications: [
        { id: 1, targetUserId: 1, targetRole: 'requester', text: '👤 Requester Alert: Welcome to ERMS! You will receive live alerts as your tickets change states.', date: 'Just now', read: false },
        { id: 2, targetUserId: 2, targetRole: 'manager', text: '📊 Manager Alert: Pending Request #102 at Remote / Home Office is waiting for your technician assignment.', date: 'Just now', read: false },
        { id: 3, targetUserId: 3, targetRole: 'technician', text: '🛠️ Technician Alert: Ticket #101 (MacBook Pro Screen Glitch) is assigned to you.', date: 'Just now', read: false }
      ]
    };

    const savedUser = localStorage.getItem('erms_saved_user');
    if (savedUser) {
      try { memoryDB.currentUser = JSON.parse(savedUser); } catch(e){}
    }

    let seenNotificationIds = new Set();

    gunDB.get('state').on((cloudData) => {
      if (cloudData) {
        try {
          const parsed = JSON.parse(cloudData);
          if (parsed && parsed.requests && parsed.users) {
            const previousCount = (memoryDB.notifications || []).length;
            memoryDB.requests = parsed.requests;
            memoryDB.users = parsed.users;
            memoryDB.notifications = parsed.notifications || memoryDB.notifications;

            if (memoryDB.currentUser && memoryDB.notifications.length > previousCount) {
              const myUnread = getMyNotifications(memoryDB.currentUser).filter(n => !n.read && !seenNotificationIds.has(n.id));
              if (myUnread.length > 0) {
                myUnread.forEach(n => {
                  seenNotificationIds.add(n.id);
                  showToast(n.text);
                });
              }
            }

            refreshCurrentView();
          }
        } catch(err) {
          console.error("Cloud parse error:", err);
        }
      }
    });

    function pushStateToCloud() {
      const payload = {
        users: memoryDB.users,
        requests: memoryDB.requests,
        notifications: memoryDB.notifications
      };
      gunDB.get('state').put(JSON.stringify(payload));
    }

    gunDB.get('state').once((data) => {
      if (!data) {
        pushStateToCloud();
      }
    });

    function addNotification(targetUserId, targetRole, text) {
      const newNotif = {
        id: Date.now() + Math.floor(Math.random() * 1000),
        targetUserId: targetUserId,
        targetRole: targetRole,
        text: text,
        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        read: false
      };
      memoryDB.notifications.unshift(newNotif);
      pushStateToCloud();

      if (memoryDB.currentUser && (memoryDB.currentUser.id === targetUserId || memoryDB.currentUser.role === targetRole || targetRole === 'all')) {
        showToast(text);
      }
    }

    function getMyNotifications(user) {
      if (!user) return [];
      return memoryDB.notifications.filter(n => 
        n.targetUserId === user.id || 
        n.targetRole === user.role || 
        n.targetRole === 'all'
      );
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto bg-slate-900 border border-slate-700 text-white text-xs px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 transition-all duration-300 transform translate-y-2 opacity-0 max-w-sm';
      toast.innerHTML = `
        <span class="text-base">🔔</span>
        <div class="flex-1 font-medium leading-snug">${message}</div>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 50);

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    let currentActiveView = 'landing';
    let currentActiveParam = null;

    function refreshCurrentView() {
      if (currentActiveView !== 'auth') {
        showView(currentActiveView, currentActiveParam);
      }
    }

    function showView(view, param = null) {
      currentActiveView = view;
      currentActiveParam = param;

      const root = document.getElementById('app-root');
      const nav = document.getElementById('nav-actions');

      if (memoryDB.currentUser) {
        const u = memoryDB.currentUser;
        const myNotifs = getMyNotifications(u);
        const unreadCount = myNotifs.filter(n => !n.read).length;

        nav.innerHTML = `
          <button onclick="toggleNotifs()" class="relative p-2 text-slate-300 hover:text-white transition" title="Role Notifications">
            <span class="text-xl">🔔</span>
            ${unreadCount > 0 ? `
              <span class="absolute top-1 right-1 w-5 h-5 bg-red-500 text-[10px] text-white font-bold rounded-full flex items-center justify-center pulse-badge">
                ${unreadCount}
              </span>
            ` : ''}
          </button>
          <div class="hidden sm:flex flex-col text-right">
            <span class="text-xs font-bold text-white leading-tight">${u.name}</span>
            <span class="text-[10px] text-sky-400 capitalize font-medium">${u.role} &bull; ${u.department || 'Enterprise'}</span>
          </div>
          <button onclick="logout()" class="text-xs bg-red-600/90 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg font-semibold transition">Logout</button>
        `;
      } else {
        nav.innerHTML = `
          <button onclick="showView('landing')" class="text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg transition">All Portals</button>
        `;
      }

      if (view === 'landing') renderLanding(root);
      else if (view === 'auth') renderAuth(root, param || { role: 'requester', mode: 'login' });
      else if (view === 'requester_dashboard') renderRequesterDashboard(root);
      else if (view === 'manager_dashboard') renderManagerDashboard(root);
      else if (view === 'technician_dashboard') renderTechnicianDashboard(root);
    }

    function renderLanding(root) {
      if (memoryDB.currentUser) {
        showView(memoryDB.currentUser.role + '_dashboard');
        return;
      }
      root.innerHTML = `
        <div class="text-center py-10 sm:py-16">
          <div class="inline-flex items-center space-x-2 bg-emerald-100 border border-emerald-300 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-2">
            <span class="w-2 h-2 rounded-full bg-emerald-600 animate-pulse"></span>
            <span>Live Multi-Device Notifications & Cloud Sync</span>
          </div>
          <h1 class="text-3xl sm:text-5xl font-extrabold text-slate-900 mt-2 tracking-tight">Enterprise Request Management</h1>
          <p class="text-slate-600 max-w-2xl mx-auto mt-3 text-sm sm:text-base">Every role receives real-time notifications: Requesters know when work starts and finishes, Managers are alerted of incoming requests, and Technicians get notified the second they are assigned.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-5xl mx-auto">
          <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between">
            <div>
              <div class="w-12 h-12 bg-sky-100 text-sky-600 rounded-xl flex items-center justify-center text-2xl font-bold mb-4">👤</div>
              <h3 class="text-xl font-bold text-slate-800">Requester Portal</h3>
              <p class="text-slate-500 text-xs sm:text-sm mt-2">Submit tickets with building/office locations. Receives instant notifications when a manager assigns a tech and when the task is resolved!</p>
            </div>
            <div class="mt-6 space-y-2">
              <button onclick="showView('auth', { role: 'requester', mode: 'login' })" class="w-full py-2.5 bg-sky-600 hover:bg-sky-700 text-white rounded-xl font-semibold text-xs sm:text-sm transition">Sign In as Requester</button>
              <button onclick="showView('auth', { role: 'requester', mode: 'signup' })" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-semibold text-xs transition">Create Requester Account</button>
            </div>
          </div>

          <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between">
            <div>
              <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center text-2xl font-bold mb-4">📊</div>
              <h3 class="text-xl font-bold text-slate-800">Manager Portal (For Your Friend)</h3>
              <p class="text-slate-500 text-xs sm:text-sm mt-2">Receives instant notifications when new tickets arrive from any requester. Approve, prioritize, and dispatch technicians with 1-click!</p>
            </div>
            <div class="mt-6 space-y-2">
              <button onclick="showView('auth', { role: 'manager', mode: 'login' })" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold text-xs sm:text-sm transition">Sign In as Manager</button>
              <button onclick="showView('auth', { role: 'manager', mode: 'signup' })" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-semibold text-xs transition">Create Manager Account</button>
            </div>
          </div>

          <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between">
            <div>
              <div class="w-12 h-12 bg-teal-100 text-teal-600 rounded-xl flex items-center justify-center text-2xl font-bold mb-4">🛠️</div>
              <h3 class="text-xl font-bold text-slate-800">Technician Terminal</h3>
              <p class="text-slate-500 text-xs sm:text-sm mt-2">Receives immediate sound/toast notifications whenever assigned work orders by a Manager. View location and mark complete.</p>
            </div>
            <div class="mt-6 space-y-2">
              <button onclick="showView('auth', { role: 'technician', mode: 'login' })" class="w-full py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-xl font-semibold text-xs sm:text-sm transition">Sign In as Technician</button>
              <button onclick="showView('auth', { role: 'technician', mode: 'signup' })" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-semibold text-xs transition">Create Technician Account</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderAuth(root, config) {
      const role = config.role;
      const isSignUp = config.mode === 'signup';
      const roleTheme = {
        requester: { color: 'sky', label: 'Requester' },
        manager: { color: 'indigo', label: 'Manager' },
        technician: { color: 'teal', label: 'Technician' }
      }[role];

      root.innerHTML = `
        <div class="max-w-md mx-auto my-8 bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200">
          <div class="text-center mb-6">
            <span class="text-xs uppercase font-bold tracking-wider text-${roleTheme.color}-600 bg-${roleTheme.color}-50 px-3 py-1 rounded-full">${roleTheme.label} Portal</span>
            <h2 class="text-2xl font-bold text-slate-900 mt-2">${isSignUp ? 'Create New Account' : 'Sign In with Your Details'}</h2>
            <p class="text-xs text-slate-500 mt-1">${isSignUp ? 'Accounts instantly sync to all devices in the cloud' : 'Enter your email and password'}</p>
          </div>

          <form onsubmit="handleAuthSubmit(event, '${role}', ${isSignUp})" class="space-y-4">
            ${isSignUp ? `
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Your Full Name</label>
                <input type="text" id="auth-name" required placeholder="e.g. Alex Johnson" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-${roleTheme.color}-500">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Department / Specialty</label>
                <input type="text" id="auth-dept" required placeholder="e.g. Finance, IT, Logistics" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-${roleTheme.color}-500">
              </div>
            ` : ''}

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
              <input type="email" id="auth-email" required placeholder="youremail@example.com" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-${roleTheme.color}-500">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
              <input type="password" id="auth-pass" required placeholder="Enter password" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-${roleTheme.color}-500">
            </div>

            <button type="submit" class="w-full py-2.5 bg-${roleTheme.color}-600 hover:bg-${roleTheme.color}-700 text-white font-semibold rounded-xl text-sm transition shadow-sm">
              ${isSignUp ? 'Complete Registration & Sign In' : 'Sign In to ' + roleTheme.label + ' Portal'}
            </button>
          </form>

          <div class="mt-6 pt-4 border-t border-slate-100 text-center">
            ${isSignUp ? `
              <p class="text-xs text-slate-600">Already registered? 
                <button onclick="showView('auth', { role: '${role}', mode: 'login' })" class="text-${roleTheme.color}-600 font-bold hover:underline">Sign In here</button>
              </p>
            ` : `
              <p class="text-xs text-slate-600">Want to register with your own details? 
                <button onclick="showView('auth', { role: '${role}', mode: 'signup' })" class="text-${roleTheme.color}-600 font-bold hover:underline">Create an account</button>
              </p>
            `}
            <div class="mt-3">
              <button onclick="showView('landing')" class="text-xs text-slate-400 hover:text-slate-600">&larr; Back to all portals</button>
            </div>
          </div>
        </div>
      `;
    }

    function handleAuthSubmit(e, role, isSignUp) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value.trim().toLowerCase();
      const password = document.getElementById('auth-pass').value.trim();

      if (isSignUp) {
        const name = document.getElementById('auth-name').value.trim();
        const dept = document.getElementById('auth-dept').value.trim();

        if (memoryDB.users.some(u => u.email === email)) {
          alert('An account with this email already exists. Please sign in instead.');
          return;
        }

        const newUser = {
          id: Date.now(),
          name: name,
          email: email,
          password: password,
          role: role,
          department: dept,
          status: role === 'technician' ? 'Available' : undefined
        };

        memoryDB.users.push(newUser);
        memoryDB.currentUser = newUser;
        localStorage.setItem('erms_saved_user', JSON.stringify(newUser));
        pushStateToCloud();

        addNotification(newUser.id, role, `Welcome to ERMS, ${name}! Your ${role} profile is online with multi-device notifications.`);
        alert(`Account created successfully! Welcome, ${name}.`);
        showView(role + '_dashboard');
      } else {
        const found = memoryDB.users.find(u => u.email.toLowerCase() === email && u.password === password);
        if (!found) {
          alert('Invalid email or password. If you do not have an account, click "Create an account" below.');
          return;
        }
        if (found.role !== role) {
          alert(`Access Restricted: This account is registered as "${found.role}". Please log in via the ${found.role} portal.`);
          return;
        }
        memoryDB.currentUser = found;
        localStorage.setItem('erms_saved_user', JSON.stringify(found));
        showView(role + '_dashboard');
      }
    }

    function logout() {

      const customInput = document.getElementById('req-location-custom');

    function openNewReqModal() { document.getElementById('new-req-modal').classList.remove('hidden'); }

    function submitNewRequest(e) {
      e.preventDefault();
      const selectLoc = document.getElementById('req-location-select').value;
      const customLoc = document.getElementById('req-location-custom').value.trim();
      const finalLocation = selectLoc === 'Custom' ? (customLoc || 'Custom Location') : selectLoc;

      const newReq = {
        id: Math.floor(100 + Math.random() * 900),
        title: document.getElementById('req-title').value.trim(),
        category: document.getElementById('req-cat').value,
        priority: document.getElementById('req-prio').value,
        status: 'Pending',
        location: finalLocation,
        requesterId: memoryDB.currentUser.id,
        requesterName: memoryDB.currentUser.name,
        requesterDept: memoryDB.currentUser.department || 'General',
        techId: null,
        techName: null,
        description: document.getElementById('req-desc').value.trim(),
        date: new Date().toISOString().split('T')[0]
      };

      memoryDB.requests.unshift(newReq);
      pushStateToCloud();

      // 1. Notify Requester
      addNotification(memoryDB.currentUser.id, 'requester', `Ticket #${newReq.id} ("${newReq.title}") submitted at ${finalLocation}. Awaiting manager review.`);
      
      // 2. Notify ALL Managers (including your friend)
      addNotification(null, 'manager', `🚨 Manager Alert: New Request #${newReq.id} ("${newReq.title}") submitted by ${memoryDB.currentUser.name} at location: ${finalLocation}.`);

      closeNewReqModal();
      showView('requester_dashboard');
    }

          return `

    function confirmAssignment() {
      const selected = document.querySelector('input[name="selected_tech"]:checked');
      if (!selected) {
        alert('Please select a technician from the list.');
        return;
      }
      const techId = parseInt(selected.value);
      const r = memoryDB.requests.find(x => x.id === currentAssignReqId);
      const tech = memoryDB.users.find(u => u.id === techId);

      if (r && tech) {
        r.techId = tech.id;
        r.techName = tech.name;
        r.status = 'Assigned';
        pushStateToCloud();

        // 1. Alert the technician across devices
        addNotification(tech.id, 'technician', `🛠️ Technician Alert: You were assigned to Ticket #${r.id} ("${r.title}") at location: ${r.location}. Requester: ${r.requesterName}.`);

        // 2. Alert the requester
        addNotification(r.requesterId, 'requester', `👤 Requester Alert: Technician ${tech.name} has been assigned to your ticket #${r.id} ("${r.title}").`);

        // 3. Alert managers
        addNotification(null, 'manager', `📊 Manager Alert: Ticket #${r.id} dispatched to ${tech.name}.`);

        closeAssignModal();
        showView('manager_dashboard');
        alert(`Assigned to ${tech.name}! Notifications dispatched across all roles.`);
      }
    }

      const name = document.getElementById('new-tech-name').value.trim();
      const email = document.getElementById('new-tech-email').value.trim().toLowerCase();
      const dept = document.getElementById('new-tech-dept').value.trim();

      if (!name || !email) {
        alert('Please provide technician name and email.');
        return;
      }
      if (memoryDB.users.some(u => u.email === email)) {
        alert('A user with this email already exists.');
        return;
      }

      const newTech = {
        id: Date.now(),
        name: name,
        email: email,
        password: 'password123',
        role: 'technician',
        department: dept || 'Technical Services',
        status: 'Available'
      };

      memoryDB.users.push(newTech);
      pushStateToCloud();
      addNotification(null, 'manager', `📊 Manager Alert: New technician ${name} added to roster.`);
      alert(`Technician ${name} added and synced to cloud!`);
      toggleNewTechForm();
      openAssignModal(currentAssignReqId);
    }

        addNotification(null, 'manager', `📊 Manager Alert: Ticket #${r.id} marked as ${status}.`);
        
        showView('manager_dashboard');

                      </td>
                      <td class="p-3 text-xs">
                        <span class="inline-flex items-center text-indigo-700 font-bold bg-indigo-50 px-2.5 py-1 rounded-lg border border-indigo-100">
                          📍 ${job.location || 'Main Office'}
                        </span>
                      </td>
                      <td class="p-3">
                        <div class="font-semibold text-slate-800">${job.title}</div>
                        <div class="text-xs text-slate-500">${job.description}</div>
                      </td>
                      <td class="p-3">
                        <span class="text-xs px-2 py-0.5 rounded font-semibold ${job.priority === 'Critical' ? 'bg-red-100 text-red-700' : 'bg-orange-100 text-orange-700'}">${job.priority}</span>
                      </td>
                      <td class="p-3"><span class="badge-${job.status} text-xs font-semibold px-2.5 py-0.5 rounded-full">${job.status}</span></td>
                      <td class="p-3 text-right">
                        ${job.status === 'Assigned' ? `
                          <button onclick="updateTechnicianTask(${job.id}, 'InProgress')" class="px-3 py-1.5 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-xs font-semibold shadow-sm">Start Working</button>
                        ` : job.status === 'InProgress' ? `
                          <button onclick="updateTechnicianTask(${job.id}, 'Completed')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold shadow-sm">Mark as Resolved ✓</button>
                        ` : `
                          <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded">✓ Resolved</span>
                        `}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `}
        </div>
      `;
    }

    function updateTechnicianTask(reqId, status) {
      const r = memoryDB.requests.find(x => x.id === reqId);
      if (r) {
        r.status = status;
        pushStateToCloud();

        if (status === 'InProgress') {
          // Notify Requester
          addNotification(r.requesterId, 'requester', `🛠️ Technician ${memoryDB.currentUser.name} has started working on Ticket #${reqId} ("${r.title}") at ${r.location}.`);
          // Notify Manager
          addNotification(null, 'manager', `📊 Manager Alert: Technician ${memoryDB.currentUser.name} has commenced work on Ticket #${reqId}.`);
        } else if (status === 'Completed') {
          // Notify Requester
          addNotification(r.requesterId, 'requester', `🎉 Great news! Ticket #${reqId} ("${r.title}") at ${r.location} has been marked as COMPLETED by Technician ${memoryDB.currentUser.name}.`);
          // Notify Manager
          addNotification(null, 'manager', `✅ Manager Alert: Ticket #${reqId} ("${r.title}") was completed by Technician ${memoryDB.currentUser.name}.`);
          // Notify Technician
          addNotification(memoryDB.currentUser.id, 'technician', `✓ You marked Ticket #${reqId} as resolved. Great job!`);
        }

        showView('technician_dashboard');
      }
    }

    // --- NOTIFICATIONS SYSTEM ---
    function toggleNotifs() {
      const modal = document.getElementById('notif-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        const user = memoryDB.currentUser;
        if (!user) return;

        document.getElementById('notif-user-info').innerText = `Notifications for ${user.name} (${user.role.toUpperCase()})`;
        const myNotifs = getMyNotifications(user);
        const container = document.getElementById('notif-items');

        if (myNotifs.length === 0) {
          container.innerHTML = `<div class="p-6 text-center text-xs text-slate-400">No notifications right now. Alerts will appear here when tickets are assigned, updated, or completed.</div>`;
        } else {
          container.innerHTML = myNotifs.map(n => `
            <div class="p-3.5 bg-slate-50 hover:bg-slate-100/80 rounded-xl border border-slate-200/80 text-xs transition">
              <p class="text-slate-800 font-medium leading-relaxed">${n.text}</p>
              <div class="flex items-center justify-between mt-2 pt-1 border-t border-slate-200/50">
                <span class="text-[10px] text-slate-400">${n.date}</span>
                <span class="text-[10px] text-sky-600 font-semibold font-mono uppercase">${n.targetRole || 'ALERT'}</span>
              </div>
            </div>
          `).join('');

          // Mark as read
          memoryDB.notifications.forEach(n => {
            if (n.targetUserId === user.id || n.targetRole === user.role || n.targetRole === 'all') {
              n.read = true;
            }
          });
          pushStateToCloud();
          const badge = document.querySelector('.pulse-badge');
          if (badge) badge.remove();
        }
      }
    }

    function clearNotifs() {
      const user = memoryDB.currentUser;
      if (user) {
        memoryDB.notifications = memoryDB.notifications.filter(n => !(n.targetUserId === user.id || n.targetRole === user.role));
        pushStateToCloud();
      }
      toggleNotifs();
      showView(user ? user.role + '_dashboard' : 'landing');
    }

    showView('landing');
  </script>
</body>
</html>
